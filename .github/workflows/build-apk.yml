name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "9.3.1"
      JAVA_VERSION: "17"
      APK_PATH: app/build/outputs/apk/debug/app-debug.apk
      ARTIFACT_NAME: app-debug-apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify active Java version
        run: |
          set -euo pipefail
          java -version
          java_version="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/ {print $2; exit}')"
          echo "Active Java specification version: ${java_version}"
          if [ "${java_version}" != "17" ]; then
            echo "::error::Java 17 is required but Java ${java_version} is active."
            exit 1
          fi

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          gradle_home="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}"
          zip_path="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}-bin.zip"
          url="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "Downloading ${url}"
          curl --fail --location --silent --show-error --retry 3 --output "${zip_path}" "${url}"
          unzip -q "${zip_path}" -d "${RUNNER_TEMP}"
          chmod +x "${gradle_home}/bin/gradle"
          echo "${gradle_home}/bin" >> "${GITHUB_PATH}"
          echo "GRADLE_HOME=${gradle_home}" >> "${GITHUB_ENV}"

      - name: Verify Gradle version
        run: |
          set -euo pipefail
          version_output="$(gradle --version)"
          printf '%s\n' "${version_output}"
          gradle_version="$(printf '%s\n' "${version_output}" | awk '/^Gradle [0-9]/ {print $2; exit}')"
          echo "Active Gradle version: ${gradle_version}"
          if [ "${gradle_version}" != "${GRADLE_VERSION}" ]; then
            echo "::error::Gradle ${GRADLE_VERSION} is required but Gradle ${gradle_version} is active."
            exit 1
          fi
          if [ -x ./gradlew ]; then
            echo "Repository Gradle wrapper exists but is intentionally not used."
          fi

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.android"
          keystore="${HOME}/.android/debug.keystore"
          rm -f "${keystore}"
          keytool -genkeypair -v \
            -keystore "${keystore}" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -f "${keystore}"
          echo "Temporary debug keystore created at ${keystore} (never uploaded)."
          echo "Keystore created before the build step." >> "${GITHUB_STEP_SUMMARY}"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          set -euo pipefail
          test -f "${APK_PATH}"
          apk_name="$(basename "${APK_PATH}")"
          case "${apk_name}" in
            *.apk) echo "APK file name is valid: ${apk_name}" ;;
            *) echo "::error::Expected an .apk file, found ${apk_name}"; exit 1 ;;
          esac
          unzip -l "${APK_PATH}" | grep -q "AndroidManifest.xml"
          unzip -l "${APK_PATH}" | grep -q "classes.dex"
          echo "Verified real APK payload (AndroidManifest.xml and classes.dex present)."
          echo "APK size: $(du -h "${APK_PATH}" | cut -f1)"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Record APK build success
        run: |
          set -euo pipefail
          {
            echo "## APK build"
            echo ""
            echo "- Build: gradle :app:assembleDebug --stacktrace --no-daemon"
            echo "- APK path: ${APK_PATH}"
            echo "- Actions artifact: ${ARTIFACT_NAME}"
            echo "- Commit SHA: ${GITHUB_SHA}"
            echo "- Status: APK build and artifact upload succeeded."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare release asset
        id: asset
        run: |
          set -euo pipefail
          release_tag="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          release_title="Debug APK build ${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})"
          release_asset="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          staging="${RUNNER_TEMP}/release"
          mkdir -p "${staging}"
          cp "${APK_PATH}" "${staging}/${release_asset}"
          test -f "${staging}/${release_asset}"

          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## Debug APK (automatically generated)"
            echo ""
            echo "- This is an automatically generated debug APK."
            echo "- The APK was built by GitHub Actions."
            echo "- GitHub Actions run number: ${GITHUB_RUN_NUMBER}"
            echo "- GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Source commit SHA: ${GITHUB_SHA}"
            echo "- The APK is intended for testing."
            echo "- The APK is not a Play Store production release."
            echo "- The APK is signed only with a temporary debug keystore."
            echo ""
            echo "Download the file from the Assets section of this release."
          } > "${notes_file}"

          {
            echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
            echo "RELEASE_TITLE=${release_title}" >> "${GITHUB_ENV}"
            echo "RELEASE_ASSET=${release_asset}" >> "${GITHUB_ENV}"
            echo "RELEASE_NOTES_FILE=${notes_file}" >> "${GITHUB_ENV}"
            echo "RELEASE_ASSET_PATH=${staging}/${release_asset}" >> "${GITHUB_ENV}"
          }
          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"
          echo "asset_path=${staging}/${release_asset}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${release_asset}"
          echo "Release tag: ${release_tag}"

      - name: Publish GitHub release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "${RELEASE_ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${RELEASE_NOTES_FILE}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        id: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_ASSET: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}.apk
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: |
          set -uo pipefail

          release_outcome="${RELEASE_OUTCOME}"

          if [ "${release_outcome}" = "success" ]; then
            echo "Release publishing succeeded for ${RELEASE_TAG}."

            release_json="${RUNNER_TEMP}/release-view.json"
            if gh release view "${RELEASE_TAG}" --json tagName,name,url,assets > "${release_json}"; then
              tag_name="$(jq -r '.tagName' "${release_json}")"
              title="$(jq -r '.name' "${release_json}")"
              page_url="$(jq -r '.url' "${release_json}")"
              assets="$(jq -r '.assets[].name' "${release_json}")"

              echo "Release tag: ${tag_name}"
              echo "Release title: ${title}"
              echo "Release page URL: ${page_url}"
              echo "APK asset file name: ${RELEASE_ASSET}"
              echo "Assets on this release:"
              echo "${assets}"

              asset_found="no"
              if echo "${assets}" | grep -qx "${RELEASE_ASSET}"; then
                asset_found="yes"
              fi

              {
                echo ""
                echo "## Release published"
                echo ""
                echo "- Release tag: ${tag_name}"
                echo "- Release title: ${title}"
                echo "- Release page URL: ${page_url}"
                echo "- APK asset file name: ${RELEASE_ASSET}"
                echo "- APK asset present on the release: ${asset_found}"
                echo "- The APK can be downloaded directly from the Assets section of the release page."
                echo "- The normal Actions artifact ${ARTIFACT_NAME} is also available as a backup."
                echo ""
              } >> "${GITHUB_STEP_SUMMARY}"

              if [ "${asset_found}" = "no" ]; then
                echo "::warning::Release exists but the expected APK asset was not found in the Assets section."
              fi
            else
              echo "::warning::Release was created but gh release view could not read it back."
              {
                echo ""
                echo "## Release published (verification incomplete)"
                echo ""
                echo "- Release tag: ${RELEASE_TAG}"
                echo "- The release could not be read back with gh release view."
                echo "- The normal Actions artifact ${ARTIFACT_NAME} is also available as a backup."
                echo ""
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "::warning::Release publishing FAILED. The APK build and artifact upload still succeeded."
            echo "::warning::The Actions artifact ${ARTIFACT_NAME} remains available in this workflow run."
            {
              echo ""
              echo "## Release publishing failed"
              echo ""
              echo "- Warning: publishing the GitHub release failed. No release URL is available."
              echo "- The APK build succeeded."
              echo "- The Actions artifact ${ARTIFACT_NAME} remains available in this run."
              echo "- Download the APK from the Actions run page, artifact section, artifact ${ARTIFACT_NAME}."
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          exit 0